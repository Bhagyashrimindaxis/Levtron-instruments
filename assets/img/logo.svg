<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="levGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="levGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052cc"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Symbol: Level Pulse Waves in Shield Hexagon -->
  <g transform="translate(10, 10)">
    <!-- Hexagon Outer Hex -->
    <polygon points="30,2 58,18 58,42 30,58 2,42 2,18" fill="url(#levGrad2)" opacity="0.15" stroke="url(#levGrad1)" stroke-width="2"/>
    
    <!-- Level Wave Indicators -->
    <path d="M12 38 L20 38 L25 22 L32 44 L38 28 L43 38 L48 38" fill="none" stroke="url(#levGrad1)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- High & Low Level Sensor Nodes -->
    <circle cx="25" cy="22" r="3.5" fill="#00f2fe"/>
    <circle cx="38" cy="28" r="3.5" fill="#38ef7d"/>
    <circle cx="32" cy="44" r="3" fill="#ff4d94"/>
  </g>
  
  <!-- Text Brand Name -->
  <text x="78" y="42" font-family="'Outfit', 'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="30" letter-spacing="2" fill="#ffffff">
    LEVTRON
  </text>
  
  <!-- Subtitle -->
  <text x="80" y="58" font-family="'Inter', 'Roboto', sans-serif" font-weight="600" font-size="10" letter-spacing="3" fill="#00d2ff">
    INSTRUMENTS PVT LTD
  </text>
  
  <!-- Accent Line -->
  <line x1="78" y1="64" x2="280" y2="64" stroke="url(#levGrad1)" stroke-width="2" stroke-linecap="round"/>
</svg>
